<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladies Outlet - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #receipt-print-area, #receipt-print-area * { visibility: visible; }
      #receipt-print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header -->
  <header class="bg-indigo-900 text-white px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <i data-lucide="store" class="w-6 h-6 text-pink-400"></i>
      <h1 class="text-xl font-bold tracking-wide">Ladies Outlet POS</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="db-status" class="px-3 py-1 text-xs rounded-full bg-yellow-500 text-black font-semibold">Connecting...</span>
      <span id="clock" class="text-sm font-medium text-gray-300"></span>
    </div>
  </header>

  <!-- Error Alert Banner (Hidden unless error occurs) -->
  <div id="error-banner" class="hidden bg-red-600 text-white px-4 py-2 text-xs font-mono"></div>

  <!-- Main POS Workspace -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Left: Product Catalog -->
    <section class="w-7/12 flex flex-col border-r border-gray-200 bg-white">
      <div class="p-4 border-b border-gray-200 bg-gray-50">
        <div class="relative">
          <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-gray-400"></i>
          <input type="text" id="search-box" placeholder="Search product name or code..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:outline-none text-sm">
        </div>
      </div>

      <div id="products-grid" class="flex-1 p-4 overflow-y-auto grid grid-cols-3 gap-3 auto-rows-max">
        <div class="col-span-3 text-center text-gray-400 py-10">Loading catalog from Supabase...</div>
      </div>
    </section>

    <!-- Right: Cart & Checkout -->
    <section class="w-5/12 flex flex-col bg-gray-50 justify-between">
      <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-indigo-600"></i> Current Order
        </h2>
        <button onclick="clearCart()" class="text-xs text-red-500 hover:text-red-700 font-semibold">Clear All</button>
      </div>

      <div id="cart-list" class="flex-1 p-4 overflow-y-auto space-y-2">
        <div class="text-center text-gray-400 py-12 text-sm">No items in cart.</div>
      </div>

      <div class="p-5 bg-white border-t border-gray-200 shadow-lg space-y-3">
        <div class="space-y-1.5 text-sm">
          <div class="flex justify-between text-gray-600">
            <span>Subtotal</span>
            <span id="subtotal-display" class="font-semibold">Rs. 0</span>
          </div>
          <div class="flex justify-between text-gray-600 items-center">
            <span>Discount (Rs.)</span>
            <input type="number" id="discount-input" value="0" min="0" oninput="calculateTotals()" 
                   class="w-20 px-2 py-0.5 border border-gray-300 rounded text-right text-sm">
          </div>
          <div class="flex justify-between text-base font-bold text-gray-900 pt-2 border-t border-gray-100">
            <span>Payable Amount</span>
            <span id="total-display" class="text-indigo-700 text-lg font-extrabold">Rs. 0</span>
          </div>
        </div>

        <button onclick="processCheckout()" id="checkout-btn" 
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-lg shadow flex items-center justify-center gap-2 transition">
          <i data-lucide="check-circle" class="w-5 h-5"></i> Complete Sale & Print
        </button>
      </div>
    </section>
  </main>

  <!-- Printable Receipt -->
  <div id="receipt-print-area" class="hidden font-mono p-4 max-w-xs mx-auto text-xs text-black">
    <div class="text-center mb-3">
      <h2 class="text-base font-bold uppercase">Ladies Outlet</h2>
      <p>POS Terminal Invoice</p>
      <p id="receipt-date" class="text-[10px] text-gray-600"></p>
    </div>
    <div class="border-b border-dashed border-black my-2"></div>
    <div id="receipt-items" class="space-y-1"></div>
    <div class="border-b border-dashed border-black my-2"></div>
    <div class="space-y-1 text-right">
      <div>Subtotal: <span id="receipt-subtotal"></span></div>
      <div>Discount: <span id="receipt-discount"></span></div>
      <div class="font-bold text-sm">Total: <span id="receipt-total"></span></div>
    </div>
    <div class="text-center mt-4 text-[10px]">Thank you for shopping with us!</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://akfhhyljhjaotxbbpljh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrZmhoeWxqaGphb3R4YmJwbGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NzIyMTUsImV4cCI6MjEwMjQ0ODIxNX0.hZ_Bx6Xw6Lxf9pRlNfYyqcZLezdkyYn_Z0ux58sJNfk';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allProducts = [];
    let cart = [];

    async function init() {
      lucide.createIcons();
      setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
      }, 1000);

      try {
        // Fetch products using select('*') to prevent missing column errors
        const { data, error } = await db.from('products').select('*').limit(500);

        if (error) throw error;

        allProducts = (data || []).map(p => ({
          id: p.id,
          name: p.name || p.product_name || p.title || 'Item #' + p.id,
          code: p.product_code || p.code || p.sku || p.barcode || 'CODE',
          price: parseFloat(p.sell_price || p.selling_price || p.price || p.mrp || 0)
        }));

        document.getElementById('db-status').className = 'px-3 py-1 text-xs rounded-full bg-green-500 text-white font-semibold';
        document.getElementById('db-status').innerText = 'Connected: ' + allProducts.length + ' Items';
        renderProducts(allProducts);
      } catch (err) {
        console.error('Supabase Error:', err);
        document.getElementById('db-status').className = 'px-3 py-1 text-xs rounded-full bg-red-500 text-white font-semibold';
        document.getElementById('db-status').innerText = 'Database Error';
        
        const banner = document.getElementById('error-banner');
        banner.classList.remove('hidden');
        banner.innerText = 'Error details: ' + (err.message || JSON.stringify(err));
      }
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center text-gray-400 py-10">No matching products found.</div>';
        return;
      }

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'p-3 bg-white border border-gray-200 rounded-lg hover:border-indigo-500 hover:shadow-md cursor-pointer transition flex flex-col justify-between';
        card.onclick = () => addToCart(p);
        card.innerHTML = `
          <div>
            <span class="text-[10px] text-gray-400 block font-mono">${p.code}</span>
            <h3 class="font-semibold text-gray-800 text-xs line-clamp-2 leading-snug">${p.name}</h3>
          </div>
          <div class="mt-2 text-right">
            <span class="text-sm font-bold text-indigo-700">Rs. ${p.price.toLocaleString()}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('search-box').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allProducts.filter(p => 
        p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)
      );
      renderProducts(filtered);
    });

    function addToCart(p) {
      const item = cart.find(i => i.id === p.id);
      if (item) item.qty++;
      else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
      renderCart();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-list');
      if (cart.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-12 text-sm">No items in cart.</div>';
        calculateTotals();
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="p-3 bg-white rounded-lg border border-gray-200 flex justify-between items-center">
          <div class="flex-1 pr-2">
            <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${item.name}</h4>
            <span class="text-xs text-gray-500">Rs. ${item.price.toLocaleString()}</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">-</button>
            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">+</button>
          </div>
          <div class="text-right w-20 pl-2">
            <span class="text-xs font-bold text-gray-900">Rs. ${(item.price * item.qty).toLocaleString()}</span>
          </div>
        </div>
      `).join('');

      calculateTotals();
      lucide.createIcons();
    }

    function calculateTotals() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const payable = Math.max(0, subtotal - discount);

      document.getElementById('subtotal-display').innerText = `Rs. ${subtotal.toLocaleString()}`;
      document.getElementById('total-display').innerText = `Rs. ${payable.toLocaleString()}`;
      return { subtotal, discount, payable };
    }

    async function processCheckout() {
      if (cart.length === 0) return alert('Cart is empty.');

      const { subtotal, discount, payable } = calculateTotals();
      const btn = document.getElementById('checkout-btn');
      btn.disabled = true;
      btn.innerText = 'Processing...';

      try {
        const { data: saleData, error: saleErr } = await db
          .from('sells')
          .insert([{
            total_amount: subtotal,
            discount: discount,
            grand_total: payable,
            paid_amount: payable,
            created_at: new Date().toISOString()
          }])
          .select();

        if (saleErr) throw saleErr;
        const sellId = saleData[0].id;

        const sellItems = cart.map(i => ({
          sell_id: sellId,
          product_id: i.id,
          quantity: i.qty,
          unit_price: i.price,
          sub_total: i.price * i.qty
        }));

        const { error: itemsErr } = await db.from('sell_products').insert(sellItems);
        if (itemsErr) throw itemsErr;

        document.getElementById('receipt-date').innerText = new Date().toLocaleString();
        document.getElementById('receipt-items').innerHTML = cart.map(i => `
          <div class="flex justify-between">
            <span>${i.name.substring(0, 18)} x${i.qty}</span>
            <span>Rs. ${(i.price * i.qty).toFixed(0)}</span>
          </div>
        `).join('');
        document.getElementById('receipt-subtotal').innerText = 'Rs. ' + subtotal.toFixed(0);
        document.getElementById('receipt-discount').innerText = 'Rs. ' + discount.toFixed(0);
        document.getElementById('receipt-total').innerText = 'Rs. ' + payable.toFixed(0);

        window.print();
        clearCart();
        alert('Sale completed successfully!');
      } catch (err) {
        console.error(err);
        alert('Failed to complete sale: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Complete Sale & Print';
        lucide.createIcons();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
